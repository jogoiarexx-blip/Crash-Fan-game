name: Importar V1.16 e publicar

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-v116.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  import-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Baixar e instalar a versão 1.16
        env:
          PACKAGE_URL: "https://oaisdmntprcentralus.blob.core.windows.net/files/00000000-a910-81f5-9da5-b5614aa96492/raw?se=2026-09-14T15%3A27%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a04d-425d-713d-92ae-d77754e88b08&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T11%3A12%3A38Z&ske=2026-09-15T11%3A12%3A38Z&sks=b&skv=2026-02-06&sig=f%2BNo8J6fU2DggvRXeLBG6fQQIzxD3tQBHkCIVLYfwnA%3D"
        run: |
          set -euo pipefail
          mkdir -p /tmp/crash-v116
          curl -L --fail --retry 3 "$PACKAGE_URL" -o /tmp/crash-v116.zip
          unzip -q /tmp/crash-v116.zip -d /tmp/crash-v116
          if [ -f /tmp/crash-v116/index.html ]; then
            SOURCE=/tmp/crash-v116
          else
            INDEX_FILE="$(find /tmp/crash-v116 -mindepth 2 -maxdepth 3 -type f -name index.html -print -quit)"
            test -n "$INDEX_FILE"
            SOURCE="$(dirname "$INDEX_FILE")"
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$SOURCE"/. .
          mkdir -p .github/workflows
          rm -f .github/workflows/import-v116.yml
          touch .nojekyll
          {
            echo 'name: Publicar GitHub Pages'
            echo ''
            echo 'on:'
            echo '  push:'
            echo '    branches: [main]'
            echo '  workflow_dispatch:'
            echo ''
            echo 'permissions:'
            echo '  contents: read'
            echo '  pages: write'
            echo '  id-token: write'
            echo ''
            echo 'concurrency:'
            echo '  group: pages'
            echo '  cancel-in-progress: true'
            echo ''
            echo 'jobs:'
            echo '  deploy:'
            echo '    runs-on: ubuntu-latest'
            echo '    environment:'
            echo '      name: github-pages'
            echo '      url: ${{ steps.deployment.outputs.page_url }}'
            echo '    steps:'
            echo '      - uses: actions/checkout@v4'
            echo '      - uses: actions/configure-pages@v5'
            echo '        with:'
            echo '          enablement: true'
            echo '      - uses: actions/upload-pages-artifact@v3'
            echo '        with:'
            echo '          path: .'
            echo '      - id: deployment'
            echo '        uses: actions/deploy-pages@v4'
          } > .github/workflows/pages.yml
          test -f index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publica Crash Fan Game V1.16 com cinemática"
          git push

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
