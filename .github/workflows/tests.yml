name: Testes do jogo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: FFmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Sintaxe JS
        run: |
          node --check js/game.js
          node --check js/jungle-phase.js
          node --check js/level-loader.js
          node --check js/final-boss.js

      - name: Fase 1 e dados da selva
        run: node tests/jungle-data-test.js

      - name: Rotas das fases
        run: node tests/platform-route-test.js

      - name: Runtime e regressão
        run: node tests/loader-runtime-test.js

      - name: Boss final isolado
        run: node tests/final-boss-logic-test.js

      - name: Fases 3, 4 e 5
        run: node tests/phase345-data-test.js

      - name: Organização de assets
        run: node tests/asset-organization-test.js

      - name: Banco de áudio
        run: node tests/audio-bank-test.js

      - name: Cinemática
        run: node tests/cinematic-test.js

      - name: Auditoria completa de layout
        run: node tests/full-layout-audit-test.js

      - name: Gamepad e trajetórias das fases pseudo-3D
        run: node tests/special-gamepad-test.js

      - name: Explorar trajetórias completas e registrar bloqueios
        run: node tests/playthrough-probe-test.js

      - name: Preparar Chromium para auditoria visual
        run: |
          command -v google-chrome || command -v google-chrome-stable
          npm install --no-save --no-package-lock puppeteer-core@24

      - name: Testar execução real das dez fases no Chromium
        run: node tests/browser-smoke-test.cjs

      - name: Anexar capturas de tela da auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-auditoria-visual
          path: qa-shots/
          if-no-files-found: ignore
          retention-days: 7
