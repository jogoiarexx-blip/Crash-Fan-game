name: Publish Crash Fan Game v1.25

on:
  push:
    paths:
      - '.publish-v125-final/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild current v1.25 files
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/v125-changes.tar.gz
          for p in \
            .publish-v125/archive/part-00 \
            .publish-v125/archive/part-01 \
            .publish-v125/archive/part-02 \
            .publish-v125/archive/part-03 \
            .publish-v125/archive/part-04 \
            .publish-v125/archive/part-05 \
            .publish-v125/archive/part-06 \
            .publish-v125/archive/part-07
          do
            base64 -d "$p" >> /tmp/v125-changes.tar.gz
          done
          tar -tzf /tmp/v125-changes.tar.gz >/tmp/v125-files.txt
          tar -xzf /tmp/v125-changes.tar.gz -C .
          test -f index.html
          test -f js/game.js
          test -f js/level-loader.js
          test -f js/jungle-phase.js
          test -f js/final-boss.js
          grep -q "v1.25" index.html
          grep -q "GAME_VERSION='1.25'" js/game.js
          rm -rf .publish-v125 .publish-v125-final
          rm -f .github/workflows/publish-v125.yml

      - name: Commit final version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jogoiarexx-blip"
          git config user.email "jogoiarexx@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publica Crash Fan Game v1.25 completa"
            git push origin HEAD:main
          fi
