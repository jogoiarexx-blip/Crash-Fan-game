name: Publish Crash Fan Game v1.25

on:
  push:
    paths:
      - '.publish-v125-patch/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.25 game patch
        shell: bash
        run: |
          set -euo pipefail
          cat .publish-v125-patch/part-00 .publish-v125-patch/part-01 .publish-v125-patch/part-02 > /tmp/game-v125.patch.gz.b64
          base64 -d /tmp/game-v125.patch.gz.b64 | gzip -dc > /tmp/game-v125.patch
          patch -p1 < /tmp/game-v125.patch
          grep -q "GAME_VERSION='1.25'" js/game.js
          node --check js/game.js
          node --check js/level-loader.js

      - name: Generate v1.25 visual assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          import math, random
          root=Path('.')
          (root/'assets/tiles').mkdir(parents=True,exist_ok=True)
          (root/'assets/mode7').mkdir(parents=True,exist_ok=True)

          # Temple and canyon tile sheets
          for name, theme in [('temple_tiles.webp','temple'),('canyon_tiles.webp','canyon')]:
              img=Image.new('RGBA',(640,320),(0,0,0,0)); d=ImageDraw.Draw(img)
              if theme=='temple':
                  top=(185,153,92,255); top2=(215,190,122,255); dirt=(122,86,52,255); dark=(88,60,35,255); moss=(108,136,62,255); accent=(160,126,78,255); hi=(245,220,150,255)
              else:
                  top=(176,86,36,255); top2=(236,145,61,255); dirt=(118,52,30,255); dark=(82,34,21,255); moss=(214,119,53,255); accent=(148,70,28,255); hi=(255,198,98,255)
              d.rectangle((0,0,619,139),fill=dirt); d.rectangle((0,0,619,18),fill=top); d.rectangle((0,18,619,26),fill=top2)
              for xx in range(0,620,32):
                  h=22+((xx//32)%4)*8
                  d.rectangle((xx+4,28,xx+26,138),fill=dark); d.rectangle((xx+7,28+h//3,xx+23,138),fill=accent)
                  d.line((xx+12,40,xx+8,62,xx+15,81,xx+10,102),fill=(60,40,22,255),width=2)
                  if (xx//32)%2==0: d.rectangle((xx+2,10,xx+29,16),fill=moss)
              for xx in range(8,612,64): d.rectangle((xx,0,xx+18,5),fill=hi)
              oy=150; d.rectangle((0,oy,299,oy+127),fill=dirt); d.rectangle((0,oy,299,oy+16),fill=top); d.rectangle((0,oy+16,299,oy+22),fill=top2)
              for xx in range(0,300,28):
                  d.rectangle((xx+3,oy+24,xx+22,oy+127),fill=dark); d.rectangle((xx+5,oy+24+((xx//28)%3)*6,xx+20,oy+127),fill=accent)
                  if (xx//28)%2==0: d.rectangle((xx+1,oy+8,xx+25,oy+13),fill=moss)
              img.save(root/'assets/tiles'/name,'WEBP',quality=92,method=6)

          # Mode 7 ice ground
          ice=Image.new('RGB',(512,512),(116,176,197)); d=ImageDraw.Draw(ice)
          for y in range(0,512,24):
              shade=150+((y//24)%3)*12
              d.rectangle((0,y,511,min(511,y+23)),fill=(shade,205+((y//24)%2)*10,220+((y//24)%3)*6))
          rnd=random.Random(12501)
          for _ in range(80):
              x=rnd.randrange(8,504); y=rnd.randrange(10,502); ln=rnd.randrange(10,55)
              d.line((x,y,min(511,x+ln),y+rnd.randrange(-3,4)),fill=(225,248,255),width=rnd.choice([1,1,2]))
          for _ in range(24):
              x=rnd.randrange(20,492); y=rnd.randrange(20,492)
              pts=[(x,y),(x+rnd.randrange(-14,15),y+rnd.randrange(10,24)),(x+rnd.randrange(-25,26),y+rnd.randrange(25,48))]
              d.line(pts,fill=(74,139,164),width=2)
          ice.save(root/'assets/mode7/ground_ice_mode7.webp','WEBP',quality=90,method=6)

          # Mode 7 jungle ground
          jungle=Image.new('RGB',(512,512),(111,80,42)); d=ImageDraw.Draw(jungle); rnd=random.Random(12502)
          for y in range(0,512,24):
              base=92+((y//24)%4)*7
              d.rectangle((0,y,511,min(511,y+23)),fill=(base+28,base,48))
          for _ in range(180):
              x=rnd.randrange(4,508); y=rnd.randrange(4,508); r=rnd.choice([1,2,2,3])
              col=rnd.choice([(70,57,36),(145,111,58),(88,111,48),(54,86,42)])
              d.ellipse((x-r,y-r,x+r,y+r),fill=col)
          for _ in range(45):
              x=rnd.randrange(6,506); y=rnd.randrange(6,506)
              d.line((x,y,x+rnd.randrange(-8,9),y+rnd.randrange(5,16)),fill=(63,93,43),width=2)
          jungle.save(root/'assets/mode7/ground_jungle_mode7.webp','WEBP',quality=90,method=6)

          # 4x2 roadside prop sheet, 256px cells
          sheet=Image.new('RGBA',(1024,512),(0,0,0,0)); d=ImageDraw.Draw(sheet)
          def pine(ox,oy):
              d.rectangle((ox+120,oy+135,ox+138,oy+238),fill=(83,60,43,255))
              for yy,w in [(58,78),(88,105),(122,126),(157,146)]:
                  d.polygon([(ox+129,oy+yy-45),(ox+129-w//2,oy+yy+42),(ox+129+w//2,oy+yy+42)],fill=(30,88,76,255))
                  d.line([(ox+129-w//2,oy+yy+41),(ox+129+w//2,oy+yy+41)],fill=(235,249,255,255),width=8)
          def crystals(ox,oy):
              for cx,cy,w,h in [(92,145,34,82),(132,112,38,115),(168,154,31,72)]:
                  d.polygon([(ox+cx,oy+cy-h//2),(ox+cx-w//2,oy+cy+h//2),(ox+cx+w//2,oy+cy+h//2)],fill=(116,225,246,255))
                  d.line([(ox+cx,oy+cy-h//2),(ox+cx,oy+cy+h//2)],fill=(235,255,255,255),width=4)
          def mound(ox,oy):
              d.ellipse((ox+35,oy+112,ox+222,oy+220),fill=(225,244,250,255)); d.ellipse((ox+65,oy+88,ox+178,oy+183),fill=(248,255,255,255))
          def obelisk(ox,oy):
              d.polygon([(ox+128,oy+30),(ox+82,oy+202),(ox+176,oy+202)],fill=(93,182,208,255)); d.polygon([(ox+128,oy+30),(ox+128,oy+202),(ox+176,oy+202)],fill=(67,145,174,255)); d.line((ox+128,oy+45,ox+110,oy+160,ox+142,oy+190),fill=(218,250,255,255),width=4)
          def palm(ox,oy):
              d.polygon([(ox+119,oy+230),(ox+142,oy+230),(ox+137,oy+73),(ox+122,oy+73)],fill=(121,76,40,255))
              for ang in range(0,360,45):
                  ex=130+int(math.cos(math.radians(ang))*92); ey=72+int(math.sin(math.radians(ang))*50)
                  d.polygon([(ox+130,oy+75),(ox+ex,oy+ey),(ox+136,oy+84)],fill=(55,127,57,255))
          def fern(ox,oy):
              for ang in range(-75,76,25):
                  ex=128+int(math.sin(math.radians(ang))*90); ey=205-int(math.cos(math.radians(ang))*105)
                  d.line((ox+128,oy+210,ox+ex,oy+ey),fill=(50,122,52,255),width=10)
          def totem(ox,oy):
              d.rounded_rectangle((ox+84,oy+35,ox+174,oy+225),radius=18,fill=(106,94,64,255)); d.rectangle((ox+100,oy+80,ox+120,oy+102),fill=(39,54,39,255)); d.rectangle((ox+140,oy+80,ox+160,oy+102),fill=(39,54,39,255)); d.polygon([(ox+109,oy+148),(ox+151,oy+148),(ox+130,oy+171)],fill=(56,60,42,255)); d.line((ox+92,oy+55,ox+166,oy+55),fill=(84,137,58,255),width=10)
          def rock(ox,oy):
              d.polygon([(ox+42,oy+207),(ox+70,oy+105),(ox+135,oy+70),(ox+210,oy+128),(ox+226,oy+207)],fill=(91,90,65,255)); d.polygon([(ox+70,oy+105),(ox+135,oy+70),(ox+145,oy+207),(ox+42,oy+207)],fill=(112,111,76,255)); d.ellipse((ox+70,oy+102,ox+160,oy+145),fill=(79,124,55,255))
          funcs=[pine,crystals,mound,obelisk,palm,fern,totem,rock]
          for i,fn in enumerate(funcs): fn((i%4)*256,(i//4)*256)
          sheet.save(root/'assets/mode7/roadside_props_mode7.webp','WEBP',quality=92,method=6)
          PY

      - name: Verify v1.25 runtime
        shell: bash
        run: |
          set -euo pipefail
          grep -q "v1.25" index.html
          grep -q "?v=1.25" index.html
          grep -q "GAME_VERSION='1.25'" js/game.js
          grep -q "v1.25" js/level-loader.js
          test -s assets/tiles/temple_tiles.webp
          test -s assets/tiles/canyon_tiles.webp
          test -s assets/mode7/ground_ice_mode7.webp
          test -s assets/mode7/ground_jungle_mode7.webp
          test -s assets/mode7/roadside_props_mode7.webp

      - name: Clean publish staging and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .publish-v125 .publish-v125-final .publish-direct .publish-v125-clean .publish-v125-patch .publish-v125-xz
          rm -f .github/workflows/publish-v125.yml
          git config user.name "jogoiarexx-blip"
          git config user.email "jogoiarexx@gmail.com"
          git add -A
          git commit -m "Publica Crash Fan Game v1.25 completa"
          git push origin HEAD:main
