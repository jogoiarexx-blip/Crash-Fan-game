<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Crash Bandicoot Fã Game - v0.9.1</title>
<link rel="stylesheet" href="css/style.css" />
<script src="js/game.js?v=0.9.1" defer></script>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="touch-controls" aria-label="Controles por toque">
  <div class="touch-dpad">
    <button data-action="left" aria-label="Esquerda">◀</button>
    <button data-action="down" aria-label="Agachar ou deslizar">▼</button>
    <button data-action="right" aria-label="Direita">▶</button>
  </div>
  <div class="touch-actions">
    <button class="spin" data-action="spin" aria-label="Girar">GIRO</button>
    <button class="jump" data-action="jump" aria-label="Pular">PULO</button>
  </div>
</div>
<div id="help">Controles configuráveis no menu • 3 slots de save • P/Start pausa • Gamepad</div>
</body>
</html>
